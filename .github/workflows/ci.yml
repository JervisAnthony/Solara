name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Run Ruff lint
        run: python -m ruff check .

      # The format gate will be added after the repository formatting baseline
      # is normalized in a dedicated, reviewable commit.

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  coverage:
    name: Coverage / 100%
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run coverage
        run: >-
          python -m pytest
          --cov=solara_travel
          --cov-branch
          --cov-report=term-missing

  windows:
    name: Windows / Python 3.13
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest

  package:
    name: Package / Build & Install
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build source distribution and wheel
        run: python -m build

      - name: Verify distribution artifacts
        shell: bash
        run: |
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          wheels=(dist/*.whl)
          test "${#sdists[@]}" -eq 1
          test "${#wheels[@]}" -eq 1

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/solara-package-smoke"
          "${{ runner.temp }}/solara-package-smoke/bin/python" -m pip install dist/*.whl

      - name: Check installed package
        shell: bash
        run: |
          smoke_python="${{ runner.temp }}/solara-package-smoke/bin/python"
          "$smoke_python" -m pip check
          cd "${{ runner.temp }}"
          "$smoke_python" -c "from solara_travel.application import DestinationRecommendation, RecommendationEvidence, RecommendationResult, RecommendationService"
          "$smoke_python" -c "from solara_travel.analytics import SeasonalWeatherProfile, SeasonalTemperatureComfortAssessment, SuitabilityScore"
          "$smoke_python" -c "from solara_travel.domain import Destination, RecommendationRequest"
          "$smoke_python" -c "import solara_travel; print(solara_travel.__file__)"
