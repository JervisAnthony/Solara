[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solara-travel-ai"
version = "0.1.0.dev0"
description = "Season-smart, explainable AI travel intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jervis Anthony Saldanha" }
]
keywords = [
    "artificial-intelligence",
    "recommendation-system",
    "travel",
    "travel-planning",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
web = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141,<1",
]
dev = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Repository = "https://github.com/JervisAnthony/Solara"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solara_travel.presentation.web" = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
]

[tool.coverage.run]
branch = true
source = ["solara_travel"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
